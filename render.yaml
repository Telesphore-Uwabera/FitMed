# Render hosts the Node API + Socket.IO only.
# The public site and custom domain fitnessmed.rw are on Netlify.
services:
  - type: web
    name: fitmed
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        value: https://fitnessmed.rw
      - key: FITMED_APP_URL
        value: https://fitnessmed.rw
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://fitmed-l2uv.onrender.com
      - key: SOCKET_CORS_ORIGINS
        value: https://fitnessmed.netlify.app,https://fitnessmed.rw
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: FitMed
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BREVO_API_KEY
        value: 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
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: fitmedrwanda@gmail.com
      - key: BREVO_SENDER_NAME
        value: FitMed Rwanda
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
